name: Build Android Test APK
on:
  workflow_dispatch:
  push:
    branches: [feature/android-mobile-v1]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: node scripts/prepare-mobile.mjs
      - run: npx cap add android
      - name: Install icon generator dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate branded launcher icons
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('mobile/assets/ghestban-icon.png').convert('RGB')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for d,s in sizes.items():
              p=Path('android/app/src/main/res')/('mipmap-'+d); p.mkdir(parents=True,exist_ok=True)
              im=src.resize((s,s),Image.Resampling.LANCZOS)
              im.save(p/'ic_launcher.png')
              im.save(p/'ic_launcher_round.png')
              im.save(p/'ic_launcher_foreground.png')
          PY
      - name: Set stable Android version
        run: |
          sed -i 's/versionCode [0-9]\\+/versionCode 310704/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "3.10.7-beta.4"/g' android/app/build.gradle
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ghestban-Mobile-3.10.7-beta.4
          path: android/app/build/outputs/apk/debug/app-debug.apk
