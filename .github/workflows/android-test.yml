name: Build Android Test APK
on:
  workflow_dispatch:
  push:
    branches: [feature/android-mobile-v1, feature/ghestban-next]
    paths-ignore:
      - 'server/**'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: node scripts/prepare-mobile.mjs
      - run: npx cap add android
      - name: Install icon generator dependency
        run: python -m pip install --disable-pip-check pillow || python -m pip install --disable-pip-version-check pillow
      - name: Generate branded launcher icons
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('mobile/assets/ghestban-icon.png').convert('RGB')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for d,s in sizes.items():
              p=Path('android/app/src/main/res')/('mipmap-'+d); p.mkdir(parents=True,exist_ok=True)
              im=src.resize((s,s),Image.Resampling.LANCZOS)
              im.save(p/'ic_launcher.png'); im.save(p/'ic_launcher_round.png'); im.save(p/'ic_launcher_foreground.png')
          PY
      - name: Set Android version
        run: |
          sed -i 's/versionCode [0-9]\+/versionCode 312001/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "3.12.0-alpha.1"/g' android/app/build.gradle
      - run: npx cap sync android
      - name: Install Ghestban native SMS bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          pkg=Path('android/app/src/main/java/ir/ghestban/app')
          pkg.mkdir(parents=True,exist_ok=True)

          manifest=Path('android/app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          perm='<uses-permission android:name="android.permission.RECEIVE_SMS" />'
          if perm not in s:
              s=s.replace('<application',perm+'\n    <application')
          receiver='''<receiver android:name=".GhestbanSmsReceiver" android:exported="true" android:permission="android.permission.BROADCAST_SMS">
              <intent-filter android:priority="500">
                  <action android:name="android.provider.Telephony.SMS_RECEIVED" />
              </intent-filter>
          </receiver>'''
          if 'GhestbanSmsReceiver' not in s:
              s=s.replace('</application>',receiver+'\n    </application>')
          manifest.write_text(s)

          (pkg/'GhestbanSmsPlugin.java').write_text(r'''package ir.ghestban.app;
          import android.Manifest;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;

          @CapacitorPlugin(
            name = "GhestbanSms",
            permissions = { @Permission(alias = "sms", strings = { Manifest.permission.RECEIVE_SMS }) }
          )
          public class GhestbanSmsPlugin extends Plugin {}
          ''')

          (pkg/'GhestbanSmsReceiver.java').write_text(r'''package ir.ghestban.app;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.provider.Telephony;
          import android.telephony.SmsMessage;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class GhestbanSmsReceiver extends BroadcastReceiver {
            public static final String ACTION = "ir.ghestban.app.BANK_SMS";
            public static final String PREFS = "ghestban_sms";
            public static final String QUEUE = "queue";

            @Override public void onReceive(Context context, Intent intent) {
              if (!Telephony.Sms.Intents.SMS_RECEIVED_ACTION.equals(intent.getAction())) return;
              StringBuilder body = new StringBuilder();
              String sender = "";
              for (SmsMessage m : Telephony.Sms.Intents.getMessagesFromIntent(intent)) {
                if (m == null) continue;
                if (m.getMessageBody() != null) body.append(m.getMessageBody());
                if (sender.isEmpty() && m.getOriginatingAddress() != null) sender = m.getOriginatingAddress();
              }
              if (body.length() == 0) return;
              try {
                SharedPreferences sp = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                JSONArray old = new JSONArray(sp.getString(QUEUE, "[]"));
                JSONArray q = new JSONArray();
                int start = Math.max(0, old.length() - 49);
                for (int i = start; i < old.length(); i++) q.put(old.get(i));
                JSONObject item = new JSONObject();
                item.put("sender", sender);
                item.put("body", body.toString());
                item.put("receivedAt", System.currentTimeMillis());
                q.put(item);
                sp.edit().putString(QUEUE, q.toString()).apply();
              } catch (Exception ignored) {}
              Intent wake = new Intent(ACTION);
              wake.setPackage(context.getPackageName());
              context.sendBroadcast(wake);
            }
          }
          ''')

          (pkg/'MainActivity.java').write_text(r'''package ir.ghestban.app;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
            private boolean receiverRegistered = false;
            private final BroadcastReceiver smsWake = new BroadcastReceiver() {
              @Override public void onReceive(Context context, Intent intent) {
                if (GhestbanSmsReceiver.ACTION.equals(intent.getAction())) drainSmsQueue();
              }
            };

            @Override public void onCreate(Bundle savedInstanceState) {
              registerPlugin(GhestbanSmsPlugin.class);
              super.onCreate(savedInstanceState);
            }

            @Override protected void onStart() {
              super.onStart();
              if (!receiverRegistered) {
                ContextCompat.registerReceiver(this, smsWake, new IntentFilter(GhestbanSmsReceiver.ACTION), ContextCompat.RECEIVER_NOT_EXPORTED);
                receiverRegistered = true;
              }
            }

            @Override protected void onResume() {
              super.onResume();
              drainSmsQueue();
            }

            @Override protected void onStop() {
              if (receiverRegistered) {
                try { unregisterReceiver(smsWake); } catch (Exception ignored) {}
                receiverRegistered = false;
              }
              super.onStop();
            }

            private void drainSmsQueue() {
              if (getBridge() == null || getBridge().getWebView() == null) return;
              SharedPreferences sp = getSharedPreferences(GhestbanSmsReceiver.PREFS, MODE_PRIVATE);
              final String raw = sp.getString(GhestbanSmsReceiver.QUEUE, "[]");
              if (raw == null || "[]".equals(raw)) return;
              sp.edit().putString(GhestbanSmsReceiver.QUEUE, "[]").apply();
              getBridge().getWebView().postDelayed(() -> {
                try {
                  JSONArray q = new JSONArray(raw);
                  for (int i = 0; i < q.length(); i++) {
                    JSONObject item = q.getJSONObject(i);
                    String js = "window.dispatchEvent(new CustomEvent('ghestbanBankSms',{detail:" + item.toString() + "}));";
                    getBridge().getWebView().evaluateJavascript(js, null);
                  }
                } catch (Exception ignored) {}
              }, 350);
            }
          }
          ''')
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ghestban-Next-3.12.0-alpha.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
