name: Apply Ghestban 3.10.1 hotfix

on:
  push:
    branches: [main]
    paths:
      - 'ghestban-patch-ready'

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble verified patch
        run: |
          cat ghestban-3.10.1.patch.part* > /tmp/ghestban-3.10.1.patch
          wc -c /tmp/ghestban-3.10.1.patch

      - name: Apply verified patch
        run: |
          git apply --check /tmp/ghestban-3.10.1.patch
          git apply /tmp/ghestban-3.10.1.patch

      - name: Verify version and hotfix markers
        run: |
          grep -F 'const APP_VERSION = "3.10.1";' index.html
          grep -F 'paymentNo: nextLoanPaymentNo(l)' index.html
          grep -F 'installmentSeq: target ? target.seq : l.paid' index.html

      - name: Remove temporary patch machinery
        run: |
          rm ghestban-3.10.1.patch.part* ghestban-patch-ready
          rm .github/workflows/apply-ghestban-hotfix.yml

      - name: Commit corrected 3.10.1 HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix: publish actual Ghestban v3.10.1 HTML"
          git push origin main
