name: Publish Ghestban 3.10.3 HTML

on:
  push:
    branches:
      - release/v3.10.3
    paths:
      - trigger-3.10.3.txt

permissions:
  contents: write

jobs:
  publish-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify base HTML
        run: |
          grep -F 'const APP_VERSION = "3.10.2";' index.html
          test "$(git hash-object index.html)" = "d20a9c98bcb385c078e8cab591c466bcf5855142"

      - name: Apply 3.10.3 patch
        run: |
          git apply --check ghestban-3.10.3.patch
          git apply ghestban-3.10.3.patch

      - name: Verify final HTML
        run: |
          grep -F 'const APP_VERSION = "3.10.3";' index.html
          grep -F 'restoreCardsBlobFromPayload(data.cardsBlob, !fromRemote);' index.html
          grep -F 'cardsRestorePendingNotice' index.html
          test "$(sha256sum index.html | awk '{print $1}')" = "eb5c4aa60b16a6dc2bd30e72a5d2b47b51382efdd044b08acd4a318133155084"
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/ghestban.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/ghestban.js

      - name: Commit actual HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "release: publish actual Ghestban v3.10.3 HTML"
          git push
