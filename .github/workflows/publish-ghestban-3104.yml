name: Publish Ghestban 3.10.4 HTML

on:
  push:
    branches:
      - release/v3.10.4
    paths:
      - trigger-3.10.4.txt

permissions:
  contents: write

jobs:
  publish-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify base HTML
        run: |
          grep -F 'const APP_VERSION = "3.10.3";' index.html
          test "$(git hash-object index.html)" = "8e3328155a78ba265aaa91f87ef0f830313df245"

      - name: Apply 3.10.4 patch
        run: |
          git apply --check ghestban-3.10.4.patch
          git apply ghestban-3.10.4.patch

      - name: Verify final HTML
        run: |
          grep -F 'const APP_VERSION = "3.10.4";' index.html
          grep -F 'btnGithubHistory' index.html
          grep -F 'renderCardTrash' index.html
          grep -F 'restoreCardsFromHistory' index.html
          test "$(sha256sum index.html | awk '{print $1}')" = "8b53d0d07ce5d6da5bdb6c056fa1c6efa6cf3391835e850e230d90a728a8f408"
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/ghestban.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/ghestban.js

      - name: Commit actual HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "release: publish actual Ghestban v3.10.4 HTML"
          git push
