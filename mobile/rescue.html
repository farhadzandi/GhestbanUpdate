<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نجات اطلاعات قسطبان</title><style>body{font-family:sans-serif;background:#f4f7f6;margin:0;padding:24px;color:#17322e}.c{max-width:560px;margin:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 5px 22px #0001}button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:14px;font:inherit;font-weight:800;background:#087c6c;color:#fff}small{line-height:2;display:block;color:#667}</style></head><body><div class="c"><h2>پشتیبان اضطراری قسطبان</h2><p>این ابزار اطلاعات موجود همین نصب را بدون تغییر یا حذف، در یک فایل محلی ذخیره می‌کند.</p><button id="b">ساخت فایل پشتیبان</button><small>PIN، Token و Secretها عمداً در فایل قرار نمی‌گیرند.</small></div><script>document.getElementById('b').onclick=()=>{const x={format:'ghestban',schema:1,createdAt:new Date().toISOString(),localStorage:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&!/token|secret|pinHash/i.test(k))x.localStorage[k]=localStorage.getItem(k)}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));a.download='Ghestban-RESCUE-'+new Date().toISOString().slice(0,10)+'.ghestban';a.click()}</script></body></html>
